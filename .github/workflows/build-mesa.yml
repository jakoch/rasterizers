name: "Build on Windows: Mesa Lavapipe"

on:
  # You can manually run this workflow.
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - main
  # This workflow runs on schedule: every Sunday at 1 am.
  #schedule:
  #  - cron: "0 1 * * 0"

# "contents: write" allows the action to create a release
# this is required by the release step, which uses "gh release create"
permissions:
  contents: write

# improve CI concurrency by automatically cancelling outdated jobs
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:

# ---------------------------------------------------------------------------------------

  build-on-windows-mesa:

# ---------------------------------------------------------------------------------------

    name: "Windows VC17"

    # https://github.com/actions/runner-images
    # Installed Software: https://github.com/actions/runner-images/blob/main/images/windows/Windows2025-Readme.md
    runs-on: ${{ matrix.config.os }}

    # Do not run the workflow if the actor is dependabot or if the PR is from a fork.
    if: ${{ ! (startsWith(github.actor, 'dependabot') || github.event.pull_request.head.repo.fork ) }}

    strategy:
      fail-fast: false
      matrix:
        config:
        # What a shitshow..
        - {
            os: "windows-2025",
            msvc_arch: "amd64",
            llvm_target: "X86",
            llvm_triple: "x86_64-pc-windows-msvc",
            cmake_generator: "x64",
            artifact_arch: "x64"
          }
        - {
            os: "windows-11-arm",
            msvc_arch: "amd64_arm64",
            llvm_target: "AArch64",
            llvm_triple: "aarch64-pc-windows-msvc",
            cmake_generator: "ARM64",
            artifact_arch: "arm64"
          }

    # LLVM:       https://github.com/llvm/llvm-project/releases
    # MESA:       https://docs.mesa3d.org/relnotes.html
    # DX-Headers: https://github.com/microsoft/DirectX-Headers/releases
    # GLSLang:    https://github.com/KhronosGroup/glslang/releases
    env:
      MESA_VERSION_TAG:   'mesa-25.3.3'
      MESA_SOURCE_DIR:    ${{github.workspace}}\mesa
      MESA_BUILD_DIR:     ${{github.workspace}}\mesa\build
      MESA_INSTALL_DIR:   ${{github.workspace}}\mesa\install
      MESA_INSTALL_DIR_LAVAPIPE: ${{github.workspace}}\mesa\install\lavapipe-${{ matrix.config.artifact_arch }}
      MESA_INSTALL_DIR_LLVMPIPE: ${{github.workspace}}\mesa\install\llvmpipe-${{ matrix.config.artifact_arch }}
      LLVM_VERSION:       '21.1.8'
      LLVM_PROJECT_DIR:   ${{github.workspace}}\llvm-project
      LLVM_CMAKE_DIR:     ${{github.workspace}}\llvm-project\cmake
      LLVM_SOURCE_DIR:    ${{github.workspace}}\llvm-project\llvm
      LLVM_BUILD_DIR:     ${{github.workspace}}\llvm-project\llvm\build
      LLVM_INSTALL_DIR:   ${{github.workspace}}\llvm-project\llvm\install
      LLVM_DEPS_DIR:      ${{github.workspace}}\llvm-project\third-party
      DIRECTX_TAG:        'v1.618.2'
      DIRECTX_SDK_DIR:    ${{github.workspace}}\directx
      GLSLANG_TAG:        '16.1.0'
      GLSLANG_DIR:        ${{github.workspace}}\glslang

    defaults:
      run:
        shell: cmd

    #
    # Building Mesa
    #
    # https://docs.mesa3d.org/install.html + https://docs.mesa3d.org/meson.html
    #
    # Build Dependencies:
    # 1. meson
    # 2. winflexbison (bison, flex)
    # 3. python packages: packaging, mako
    # 4. llvm
    # 5. directx-sdk
    #
    # Pre-installed on GHA
    # - git, curl, 7z
    # - cmake
    # - python, pip
    # - rustc
    # - msvc VC17

    steps:
      - name: 🤘 Checkout Code
        uses: actions/checkout@v6 # https://github.com/actions/checkout

      - name: 🤘 Checkout Code - https://gitlab.freedesktop.org/mesa/mesa
        run: |
          git clone --depth=1 --no-tags --single-branch --branch ${{ env.MESA_VERSION_TAG }} https://gitlab.freedesktop.org/mesa/mesa.git mesa

      - name: 🛠️ Setup Visual Studio Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1 # https://github.com/ilammy/msvc-dev-cmd
        with:
          # amd64 (x64, default) or amd64_arm64
          arch: ${{ matrix.config.msvc_arch }}

      # Commented out, because a windows-11-arm choco is unable to install a windows-11-arm cmake.
      # Thanks for nothing. Let's use the pre-installed cmake...
      # https://community.chocolatey.org/packages/cmake
      #- name: 🔽 Install CMake
      #  run: choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System' --no-progress

      # Reminder: This step requires that the CMakePresets for CI contain
      # "CMAKE_CXX_COMPILER_LAUNCHER": "sccache".
      - name: 🎯 Setup Build Cache
        uses: hendrikmuhs/ccache-action@v1 # https://github.com/hendrikmuhs/ccache-action
        with:
          variant: sccache
          key: mesa-build-${{ runner.os }}-${{ github.ref }}
          restore-keys: |
            mesa-build-${{ runner.os }}-${{ github.ref }}
            mesa-build-${{ runner.os }}

      #- name: 🎯 [CACHE] Restore LLVM build cache
      #  id: restore-llvm-cache
      #  uses: actions/cache/restore@v4
      #  with:
      #    path: ${{ env.LLVM_BUILD_DIR }}
      #    key: cache-${{ runner.os }}-llvm-${{ env.LLVM_VERSION }}-${{ hashFiles('llvm-project/llvm/**/CMakeLists.txt') }}

      - name: 🛠️ [LLVM] Make project folder
        run: |
          mkdir llvm-project

      - name: 🔽 [LLVM] Install LLVM into llvm-project folder
        working-directory: ${{ env.LLVM_PROJECT_DIR }}
        run: |
          curl -sfL -o llvm-${{ env.LLVM_VERSION }}.src.tar.xz https://github.com/llvm/llvm-project/releases/download/llvmorg-${{ env.LLVM_VERSION }}/llvm-${{ env.LLVM_VERSION }}.src.tar.xz
          7z x -bb0 -txz llvm-${{ env.LLVM_VERSION }}.src.tar.xz
          7z x -bb0 -ttar llvm-${{ env.LLVM_VERSION }}.src.tar
          del llvm-${{ env.LLVM_VERSION }}.src.tar.xz
          del llvm-${{ env.LLVM_VERSION }}.src.tar
          mv llvm-${{ env.LLVM_VERSION }}.src ${{ env.LLVM_SOURCE_DIR }}

      - name: 🔽 [LLVM] Install CMAKE modules into llvm-project folder
        working-directory: ${{ env.LLVM_PROJECT_DIR }}
        run: |
          curl -sfL -o cmake-${{ env.LLVM_VERSION }}.src.tar.xz https://github.com/llvm/llvm-project/releases/download/llvmorg-${{ env.LLVM_VERSION }}/cmake-${{ env.LLVM_VERSION }}.src.tar.xz
          7z x -bb0 -txz cmake-${{ env.LLVM_VERSION }}.src.tar.xz
          7z x -bb0 -ttar cmake-${{ env.LLVM_VERSION }}.src.tar
          del cmake-${{ env.LLVM_VERSION }}.src.tar.xz
          del cmake-${{ env.LLVM_VERSION }}.src.tar
          mv cmake-${{ env.LLVM_VERSION }}.src ${{ env.LLVM_CMAKE_DIR }}

      - name: 🔽 [LLVM] Install Third-Party into llvm-project folder
        working-directory: ${{ env.LLVM_PROJECT_DIR }}
        run: |
          curl -sfL -o third-party-${{ env.LLVM_VERSION }}.src.tar.xz https://github.com/llvm/llvm-project/releases/download/llvmorg-${{ env.LLVM_VERSION }}/third-party-${{ env.LLVM_VERSION }}.src.tar.xz
          7z x -bb0 -txz third-party-${{ env.LLVM_VERSION }}.src.tar.xz
          7z x -bb0 -ttar third-party-${{ env.LLVM_VERSION }}.src.tar
          del third-party-${{ env.LLVM_VERSION }}.src.tar.xz
          del third-party-${{ env.LLVM_VERSION }}.src.tar
          mv third-party-${{ env.LLVM_VERSION }}.src ${{ env.LLVM_DEPS_DIR }}

      # in-source build, dir: llvm-project/llvm/build
      - name: 🛠️ [LLVM] Make build folder
        working-directory: ${{ env.LLVM_SOURCE_DIR }}
        run: |
          mkdir build

      #- name: ❔ CHECK important folders, to see if everything is present (before building)
      #  run: |
      #    dir /S /B ${{ env.LLVM_PROJECT_DIR }}

      # -DLLVM_TARGETS_TO_BUILD="AArch64;ARM;X86" ^
      - name: 🖋️ [LLVM] Configure
        working-directory: ${{ env.LLVM_BUILD_DIR }}
        run: |
          cmake                                                            ^
            -B ${{ env.LLVM_BUILD_DIR }}                                   ^
            -S ${{ env.LLVM_SOURCE_DIR }}                                  ^
            -G Ninja                                                       ^
            -D CMAKE_CXX_COMPILER_LAUNCHER=sccache                         ^
            -D CMAKE_SYSTEM_NAME=Windows                                   ^
            -D CMAKE_SYSTEM_PROCESSOR=${{ runner.arch }}                   ^
            -D CMAKE_INSTALL_PREFIX="${{ env.LLVM_INSTALL_DIR }}"          ^
            -D CMAKE_BUILD_TYPE="Release"                                  ^
            -D CMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded                    ^
            -D BUILD_SHARED_LIBS=OFF                                       ^
            -D LLVM_HOST_TRIPLE=${{ matrix.config.llvm_triple }}           ^
            -D LLVM_DEFAULT_TARGET_TRIPLE=${{ matrix.config.llvm_triple }} ^
            -D LLVM_TARGETS_TO_BUILD=${{ matrix.config.llvm_target }}      ^
            -D LLVM_BUILD_BENCHMARKS=OFF                                   ^
            -D LLVM_BUILD_DOCS=OFF                                         ^
            -D LLVM_BUILD_EXAMPLES=OFF                                     ^
            -D LLVM_BUILD_LLVM_C_DYLIB=OFF                                 ^
            -D LLVM_BUILD_TESTS=OFF                                        ^
            -D LLVM_BUILD_UTILS=OFF                                        ^
            -D LLVM_ENABLE_ASSERTIONS=OFF                                  ^
            -D LLVM_ENABLE_BACKTRACES=OFF                                  ^
            -D LLVM_ENABLE_BINDINGS=OFF                                    ^
            -D LLVM_ENABLE_CRASH_OVERRIDES=OFF                             ^
            -D LLVM_ENABLE_DOXYGEN=OFF                                     ^
            -D LLVM_ENABLE_IDE=OFF                                         ^
            -D LLVM_ENABLE_LIBEDIT=OFF                                     ^
            -D LLVM_ENABLE_LIBPFM=OFF                                      ^
            -D LLVM_ENABLE_LIBXML2=OFF                                     ^
            -D LLVM_ENABLE_PEDANTIC=OFF                                    ^
            -D LLVM_ENABLE_PLUGINS=OFF                                     ^
            -D LLVM_ENABLE_SPHINX=OFF                                      ^
            -D LLVM_ENABLE_UNWIND_TABLES=OFF                               ^
            -D LLVM_ENABLE_WARNINGS=OFF                                    ^
            -D LLVM_ENABLE_WERROR=OFF                                      ^
            -D LLVM_ENABLE_Z3_SOLVER=OFF                                   ^
            -D LLVM_ENABLE_ZLIB=OFF                                        ^
            -D LLVM_INCLUDE_BENCHMARKS=OFF                                 ^
            -D LLVM_INCLUDE_DOCS=OFF                                       ^
            -D LLVM_INCLUDE_EXAMPLES=OFF                                   ^
            -D LLVM_INCLUDE_TESTS=OFF                                      ^
            -D LLVM_INCLUDE_UTILS=OFF                                      ^
            -D LLVM_OPTIMIZED_TABLEGEN=ON

      - name: 🙏 [LLVM] Build
        run: |
          ninja -C ${{ env.LLVM_BUILD_DIR }}
          ninja -C ${{ env.LLVM_BUILD_DIR }} install

      #- name: 🎯 [CACHE] Save LLVM build cache
      #  uses: actions/cache@v4
      #  id: save-llvm-cache
      #  if: always() && steps.restore-llvm-cache.outputs.cache-hit != 'true'
      #  with:
      #    path: ${{ env.LLVM_BUILD_DIR }}
      #    key: cache-${{ runner.os }}-llvm-${{ env.LLVM_VERSION }}-${{ hashFiles('llvm-project/llvm/**/CMakeLists.txt') }}

      - name: 🛠️ [LLVM] Add to PATH
        shell: pwsh
        run: |
          $env:PATH += ";${{ env.LLVM_INSTALL_DIR }};${{ env.LLVM_INSTALL_DIR }}\bin"
          echo "PATH=$env:PATH" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # https://community.chocolatey.org/packages/pkgconfiglite
      # https://community.chocolatey.org/packages/winflexbison
      # https://community.chocolatey.org/packages/winflexbison3 ???
      # https://community.chocolatey.org/packages/meson
      # https://community.chocolatey.org/packages/Lua lua53, lua54 not even on choco
      # https://community.chocolatey.org/packages/libpng is required for "screenshot" in lavapipe
      - name: 🔽 Install Tools - Meson, Winflexbison, PkgConfigLite
        run: |
          choco install meson winflexbison3 pkgconfiglite lua libpng
          refreshenv

      - name: 🛠️ [MESON] Add to PATH
        shell: pwsh
        run: |
          $env:PATH += ";C:\Program Files\Meson\"
          echo "PATH=$env:PATH" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: 🛠️ [MESON] Verify Installation
        run: meson --version

      - name: 🔽 [DIRECTX-HEADERS] Build + Install (d3d12.h)
        env:
          CC:  "sccache cl"
          CXX: "sccache cl"
        run: |
          git clone --depth=1 --no-tags --single-branch --branch ${{ env.DIRECTX_TAG }} https://github.com/microsoft/DirectX-Headers
          cd DirectX-Headers
          meson setup build --backend=ninja --buildtype=release -Dbuild-test=false --prefix="${{ env.DIRECTX_SDK_DIR }}"
          meson install -C build
          cd ..
          rm -rf DirectX-Headers

      - name: 🛠️ [DIRECTX-HEADERS] Add to PATH
        shell: pwsh
        run: |
          Test-Path "${{ env.DIRECTX_SDK_DIR }}\include\directx\d3d12.h"
          $env:PATH += ";${{ env.DIRECTX_SDK_DIR }};${{ env.DIRECTX_SDK_DIR }}\include"
          echo "PATH=$env:PATH" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: 🔽 [PYTHON] Install Packages
        run: |
          pip install packaging mako PyYAML

      # update_glslang_sources fetches the dependencies: googletest, SPIRV-Tools, SPIRV-Headers
      - name: 🔽 [GLSLANG] Build + Install glslang
        run: |
          git clone --depth=1 --no-tags --single-branch --branch ${{ env.GLSLANG_TAG }} https://github.com/KhronosGroup/glslang
          cd glslang
          python update_glslang_sources.py
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_INSTALL_PREFIX="${{ env.GLSLANG_DIR }}"
          cmake --build build --config Release --target install
          cmake --install build

      # the f**k is this? glslangValidator is not in the PATH, not even built.
      # ln -s /usr/bin/glslang /usr/bin/glslangValidator
      - name: 🛠️ [GLSLANG] Add to PATH
        shell: pwsh
        run: |
          $env:PATH += ";${{ env.GLSLANG_DIR }};${{ env.GLSLANG_DIR }}\bin"
          echo "PATH=$env:PATH" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          copy "${{ env.GLSLANG_DIR }}\bin\glslang.exe" "${{ env.GLSLANG_DIR }}\bin\glslangValidator.exe"

      #
      # Mesa Build Options
      #
      # https://gitlab.freedesktop.org/mesa/mesa/-/blob/main/meson.options
      #
      # Lavapipe is vulkan_drivers=swrast
      # LLVMPipe is gallium_drivers=llvmpipe
      #
      # -D vulkan-drivers="swrast,amd,microsoft-experimental"
      # -D gallium-drivers="swrast,d3d12,zink" deprecated with v25
      # -D gallium-drivers="softpipe,llvmpipe"
      #
      - name: 🖋️ [MESA] Setup (llvmpipe, lavapipe)
        env:
          CC:  "sccache cl"
          CXX: "sccache cl"
          CPPFLAGS: "-I${{ env.DIRECTX_SDK_DIR }}/include -I${{ env.GLSLANG_DIR }}/include"
          LDFLAGS:  "-L${{ env.DIRECTX_SDK_DIR }}/lib -L${{ env.GLSLANG_DIR }}/lib"
        run: |
          meson setup                                                         ^
          ${{ env.MESA_BUILD_DIR }}                                           ^
          ${{ env.MESA_SOURCE_DIR }}                                          ^
           --prefix="${{ env.MESA_INSTALL_DIR }}"                             ^
           --default-library=static                                           ^
          -D buildtype=release                                                ^
          -D platforms=windows                                                ^
          -D b_vscrt=mt                                                       ^
          -D b_ndebug=true                                                    ^
          -D llvm=enabled                                                     ^
          -D shared-llvm=disabled                                             ^
          -D gallium-drivers=llvmpipe                                         ^
          -D vulkan-drivers=swrast                                            ^
          -D video-codecs=                                                    ^
          -D egl=enabled                                                      ^
          -D gles1=enabled                                                    ^
          -D gles2=enabled                                                    ^
          -D build-tests=false

      - name: 🙏 [MESA] Build + Install
        run: |
          ninja -C ${{ env.MESA_BUILD_DIR }}
          ninja -C ${{ env.MESA_BUILD_DIR }} install

      - name: ❔ [MESA] Check install folder, to see if everything is present (after install)
        run: |
          dir /S /B ${{ env.MESA_INSTALL_DIR }}

      - name: Move Lavapipe driver to standalone folder for packaging
        run: |
          echo "Creating Lavapipe install folder: ${{ env.MESA_INSTALL_DIR_LAVAPIPE }}"
          mkdir "${{ env.MESA_INSTALL_DIR_LAVAPIPE }}"
          mkdir "${{ env.MESA_INSTALL_DIR_LAVAPIPE }}\bin"
          mkdir "${{ env.MESA_INSTALL_DIR_LAVAPIPE }}\lib"
          mkdir "${{ env.MESA_INSTALL_DIR_LAVAPIPE }}\share\vulkan\icd.d"
          echo "Copying Lavapipe files to standalone folder."
          copy "${{ env.MESA_INSTALL_DIR }}\bin\vulkan_lvp.dll" "${{ env.MESA_INSTALL_DIR_LAVAPIPE }}\bin\vulkan_lvp.dll"
          copy "${{ env.MESA_INSTALL_DIR }}\lib\vulkan_lvp.lib" "${{ env.MESA_INSTALL_DIR_LAVAPIPE }}\lib\vulkan_lvp.lib"
          copy "${{ env.MESA_INSTALL_DIR }}\share\vulkan\icd.d\lvp_icd.x86_64.json" "${{ env.MESA_INSTALL_DIR_LAVAPIPE }}\share\vulkan\icd.d\lvp_icd.x86_64.json"
          echo "Removing Lavapipe files from main install folder."
          del "${{ env.MESA_INSTALL_DIR }}\bin\vulkan_lvp.dll"
          del "${{ env.MESA_INSTALL_DIR }}\lib\vulkan_lvp.lib"
          rmdir /S /Q "%MESA_INSTALL_DIR_LLVMPIPE%\share"

      # Versioning Pattern: "lavapipe-win64-24.3.4.zip"
      - name: 🏷️ Versionize Artifacts
        shell: pwsh
        run: |
          $version = $env:MESA_VERSION_TAG -replace "^mesa-", ""
          echo "MESA_LAVAPIPE_VERSION=$version" >> $env:GITHUB_ENV
          echo "MESA_LAVAPIPE_ARTIFACT_NAME=lavapipe-${{ matrix.config.artifact_arch }}-$version" >> $env:GITHUB_ENV
          echo "MESA_LAVAPIPE_ARTIFACT_ZIPFILE=lavapipe-${{ matrix.config.artifact_arch }}-$version.zip" >> $env:GITHUB_ENV
          echo "MESA_LLVMPIPE_ARTIFACT_NAME=llvmpipe-${{ matrix.config.artifact_arch }}-$version" >> $env:GITHUB_ENV
          echo "MESA_LLVMPIPE_ARTIFACT_ZIPFILE=llvmpipe-${{ matrix.config.artifact_arch }}-$version.zip" >> $env:GITHUB_ENV

      # The lavapipe folder is removed. To package the LLVMPipe driver using the install dir.
      - name: 📦 Package Artifact - LavaPipe (Vulkan)
        run: |
          dir /S /B "${{ env.MESA_INSTALL_DIR }}"
          7z a -tzip -mx9 "${{ env.MESA_LAVAPIPE_ARTIFACT_ZIPFILE }}" "${{ env.MESA_INSTALL_DIR_LAVAPIPE }}\*"
          rmdir /S /Q "${{ env.MESA_INSTALL_DIR_LAVAPIPE }}"

      - name: 📦 Package Artifact - LLVMPipe (libgl-gdi/OpenGL + GLESv1 + GLESv2 + EGL + wgl/libgallium)
        run: |
          dir /S /B "${{ env.MESA_INSTALL_DIR }}"
          7z a -tzip -mx9 "${{ env.MESA_LLVMPIPE_ARTIFACT_ZIPFILE }}" "${{ env.MESA_INSTALL_DIR_LLVMPIPE }}\*"

      - name: 📦 🚀 Upload Artifact - LavaPipe
        uses: actions/upload-artifact@v6 # https://github.com/actions/upload-artifact
        with:
          name: ${{ env.MESA_LAVAPIPE_ARTIFACT_NAME }}
          path: ${{ env.MESA_LAVAPIPE_ARTIFACT_ZIPFILE }}
          compression-level: 0
          retention-days: 3

      - name: 📦 🚀 Upload Artifact - LLVMPipe
        uses: actions/upload-artifact@v4 # https://github.com/actions/upload-artifact
        with:
          name: ${{ env.MESA_LLVMPIPE_ARTIFACT_NAME }}
          path: ${{ env.MESA_LLVMPIPE_ARTIFACT_ZIPFILE }}
          compression-level: 0
          retention-days: 3

      # This is a date based version for repeatable releases.
      - name: 🏷️ Set Rolling Release Version for Tag
        shell: pwsh
        run: |
          echo "RELEASE_VERSION_TAG=$(Get-Date -Format 'yyyyMMdd')" >> $env:GITHUB_ENV

      # Step 1: Create a new release tag, or update(append) release notes if it exists.
      # if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
      - name: 📦 🚀 Create or Update Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "${{ env.RELEASE_VERSION_TAG }}"
          $new_notes = "• Mesa Lavapipe for Windows (${{ matrix.config.artifact_arch }}, VC17) ${{ env.MESA_LAVAPIPE_VERSION }}"
          $existing_notes = gh release view $tag --json body --jq ".body" 2>$null
          if ($?) {
            Write-Host "✅ Release $tag already exists. Appending new notes."
            if ($null -eq $existing_notes) { $existing_notes = "" }
            $updated_notes = "$existing_notes`n`n$new_notes"
            gh release edit $tag --notes "$updated_notes"
          } else {
            echo "🚀 Creating new release: $tag"
            gh release create $tag `
              --title "$tag" `
              --notes "$new_notes" `
              --latest
          }

      # Step 2: Upload the artifact to the release tag.
      # if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
      - name: 📦 🔼 Upload Release Artifact
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          gh release upload "${{ env.RELEASE_VERSION_TAG }}" "${{ env.MESA_LLVMPIPE_ARTIFACT_ZIPFILE }}" "${{ env.MESA_LAVAPIPE_ARTIFACT_ZIPFILE }}" --clobber
