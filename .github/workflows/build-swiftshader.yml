name: "Build on Windows: Swiftshader"

on:
  # You can manually run this workflow.
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - main
  # This workflow runs on schedule: every Sunday at 1 am.
  #schedule:
  #  - cron: "0 1 * * 0"

# "contents: write" allows the action to create a release
# this is required by the release step, which uses "gh release create"
permissions:
  contents: write

# improve CI concurrency by automatically cancelling outdated jobs
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:

# ---------------------------------------------------------------------------------------

  build-on-windows-swiftshader:

# ---------------------------------------------------------------------------------------

    # https://swiftshader.googlesource.com/SwiftShader
    # Mirror: https://github.com/google/swiftshader
    name: "Swiftshader - Win VC17"

    # https://github.com/actions/runner-images
    # Installed Software:
    # - https://github.com/actions/runner-images/blob/main/images/windows/Windows2025-Readme.md
    # - https://github.com/actions/partner-runner-images/blob/main/images/arm-windows-11-image.md
    runs-on: ${{ matrix.config.os }}

    # Do not run the workflow if the actor is dependabot or if the PR is from a fork.
    if: ${{ ! (startsWith(github.actor, 'dependabot') || github.event.pull_request.head.repo.fork ) }}

    strategy:
      fail-fast: false
      matrix:
        config:
        # What a shitshow..
        #- {
        #    os: "windows-2025",
        #    msvc_arch: "amd64",
        #    cmake_generator: "x64",
        #    artifact_arch: "x64",
        #    reactor_backend: "LLVM"
        #  }
        - {
            os: "windows-11-arm",
            msvc_arch: "amd64_arm64",
            cmake_generator: "ARM64",
            artifact_arch: "arm64",
            reactor_backend: "LLVM-Submodule"
          }

    env:
      BUILD_DIR:   ${{github.workspace}}\swiftshader\build
      INSTALL_DIR: ${{github.workspace}}\swiftshader\install

    defaults:
      run:
        shell: cmd

    steps:
      - name: Runner OS
        run: |
          echo "We are running on ${{ runner.os }} with arch ${{ runner.arch }}."
          node -e "console.log(require('os').platform() + '-' + require('os').arch())"

      # A checkout of this repo is required to push artifacts to GitHub Releases.
      - name: 🤘 Checkout Code - jakoch/rasterizers
        uses: actions/checkout@v6 # https://github.com/actions/checkout

      - name: 🤘 Checkout Code - google/swiftshader
        uses: actions/checkout@v6 # https://github.com/actions/checkout
        with:
          repository: google/swiftshader
          path: swiftshader

      - name: 🛠️ Setup Visual Studio Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1 # https://github.com/ilammy/msvc-dev-cmd
        with:
          # amd64 (x64, default) or amd64_arm64
          arch: ${{ matrix.config.msvc_arch }}

      # https://github.com/actions/runner-images/blob/main/images/windows/Windows2022-Readme.md#visual-studio-enterprise-2022
      #- name: 🛠️ Setup Visual Studio Developer Command Prompt
      #  run: call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
      #  shell: cmd

      # https://community.chocolatey.org/packages/cmake
      # This doesnt work on windows-11-arm, because chocolatey doesn't provide ARM packages...
      # so lets fallback to the system-installed cmake.
      - name: 🔽 Install CMake
        if: ${{ matrix.config.os == 'windows-2025' }}
        run: choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System' --no-progress

      # Reminder: This step requires that the CMakePresets for CI contain
      # "CMAKE_CXX_COMPILER_LAUNCHER": "sccache".
      - name: 🎯 Setup Build Cache
        uses: hendrikmuhs/ccache-action@v1 # https://github.com/hendrikmuhs/ccache-action
        with:
          variant: sccache
          key: swift-build-${{ runner.os }}-${{ github.ref }}
          restore-keys: |
            swift-build-${{ runner.os }}-${{ github.ref }}
            swift-build-${{ runner.os }}

      # For build options see
      #
      # https://github.com/google/swiftshader/blob/master/CMakeLists.txt#L162
      #
      # - D REACTOR_BACKEND="" can be one of LLVM, LLVM-Submodule, Subzero
      #
      # -D CMAKE_POLICY_VERSION_MINIMUM=3.5 was added for third_party/marl/CMakeLists.txt min version issue
      # -D SWIFTSHADER_LESS_DEBUG_INFO=TRUE
      - name: 🖋️ CMake ➔ Configure
        run: |
          cmake                                                       ^
            -B ${{ env.BUILD_DIR }}                                   ^
            -S swiftshader                                            ^
            -G Ninja                                                  ^
            -D CMAKE_CXX_COMPILER_LAUNCHER=sccache                    ^
            -D CMAKE_SYSTEM_NAME=Windows                              ^
            -D CMAKE_SYSTEM_PROCESSOR=${{ runner.arch }}              ^
            -D CMAKE_BUILD_TYPE=Release                               ^
            -D REACTOR_BACKEND="${{ matrix.config.reactor_backend }}" ^
            -D SWIFTSHADER_BUILD_PVR=OFF                              ^
            -D SWIFTSHADER_BUILD_TESTS=OFF                            ^
            -D SWIFTSHADER_BUILD_BENCHMARKS=OFF                       ^
            -D SWIFTSHADER_WARNINGS_AS_ERRORS=FALSE                   ^
            -D CMAKE_POLICY_VERSION_MINIMUM=3.5

      - name: 🙏 CMake ➔ Build
        run: |
          cmake --build ${{ env.BUILD_DIR }} --parallel --config Release --target vk_swiftshader

      #- name: CMake ➔ Install
      #  run: |
      #    cmake --install ${{ env.BUILD_DIR }} --prefix ${{ env.INSTALL_DIR }} --verbose

      - name: ❔ CHECK folders, to see if everything is present (after building & installing)
        run: |
          dir /S /B ${{ env.BUILD_DIR }}

      # dir /S /B ${{ env.INSTALL_DIR }}
      # Change back to INSTALL_DIR, when i figured out how to "cmake install" this crap.
      # Well, after build, there is a folder "Windows"... lets package only that.

      - name: 📝 Get Version of SwiftShader Library (Maj.Min.Patch.Rev)
        shell: pwsh
        run: |
          $libraryPath = "${{ env.BUILD_DIR }}\Windows\vk_swiftshader.dll"
          $versionInfo = (Get-Item $libraryPath).VersionInfo
          $fileVersionRaw = $versionInfo.FileVersionRaw
          Write-Output "FileVersionRaw: $fileVersionRaw"
          echo "SWIFTSHADER_VERSION=$fileVersionRaw" >> $env:GITHUB_ENV

      # degenerate library versioning detected,
      # see https://github.com/google/swiftshader/blob/master/src/commit_id.py
      # WTF. thanks for nothing google.
      #- name: 🧩 Get SwiftShader version
      #  run: |
      #    cd ${{github.workspace}}/swiftshader
      #    commit_count=$(git rev-list --count HEAD)
      #    commit_hash=$(git rev-parse --short=10 HEAD)
      #    SWIFTSHADER_VERSION="r${commit_count}.${commit_hash}"
      #    echo "Extracted SwiftShader version: $SWIFTSHADER_VERSION"
      #    echo "SWIFTSHADER_VERSION=$SWIFTSHADER_VERSION" >> $GITHUB_ENV

      # Versioning Pattern: "swiftshader-(x64|arm64)-5.0.0.0.zip"
      - name: 🏷️ Versionize Artifact
        shell: pwsh
        run: |
          echo "SWIFTSHADER_ARTIFACT_NAME=swiftshader-${{ matrix.config.artifact_arch }}-${{ env.SWIFTSHADER_VERSION }}" >> $env:GITHUB_ENV
          echo "SWIFTSHADER_ARTIFACT_ZIPFILE=swiftshader-${{ matrix.config.artifact_arch }}-${{ env.SWIFTSHADER_VERSION }}.zip" >> $env:GITHUB_ENV

      - name: 📦 Package Artifact
        run: |
          7z a -tzip -mx9 "${{ env.SWIFTSHADER_ARTIFACT_ZIPFILE }}" "${{ env.BUILD_DIR }}\Windows\*"

      - name: 📦 🚀 Upload Artifact
        uses: actions/upload-artifact@v6 # https://github.com/actions/upload-artifact
        with:
          name: ${{ env.SWIFTSHADER_ARTIFACT_NAME }}
          path: ${{ env.SWIFTSHADER_ARTIFACT_ZIPFILE }}
          compression-level: 0
          retention-days: 3

      # This is a date based version for repeatable releases.
      - name: 🏷️ Set Rolling Release Version for Tag
        shell: pwsh
        run: |
          echo "RELEASE_VERSION_TAG=$(Get-Date -Format 'yyyyMMdd')" >> $env:GITHUB_ENV

      # Step 1: Create a new release tag, or update(append) release notes if it exists.
      # if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
      - name: 📦 🚀 Create or Update Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "${{ env.RELEASE_VERSION_TAG }}"
          $new_notes = "• Swiftshader for Windows (${{ matrix.config.artifact_arch }}, VC17) ${{ env.SWIFTSHADER_VERSION }}`n"
          $existing_notes = gh release view $tag --json body --jq ".body" 2>$null
          if ($?) {
            echo "✅ Release $tag already exists. Appending new notes."
            if ($null -eq $existing_notes) { $existing_notes = "" }
            $existing_notes = $existing_notes.TrimEnd()
            $updated_notes = "$existing_notes`n$new_notes"
            gh release edit $tag --notes "$updated_notes"
          } else {
            echo "🚀 Creating new release: $tag"
            gh release create $tag `
              --title "$tag" `
              --notes "$new_notes" `
              --latest
          }

      # Step 2: Upload the artifact to the release tag.
      # if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
      - name: 📦 🔼 Upload Release Artifact
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          gh release upload "${{ env.RELEASE_VERSION_TAG }}" "${{ env.SWIFTSHADER_ARTIFACT_ZIPFILE }}" --clobber

